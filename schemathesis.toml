# API fuzzing config (run in CI against the built container).

# Run every check; a failure in any of them fails the build.
[checks]
enabled = true

# Some rules span several fields and JSON Schema can't express them (down payment +
# trade-in below the taxed price; lease cap cost above the residual; unique vehicle
# ids), so a request that is valid per the schema can still be a correct 422.
# Anything else is a failure. Boundary cases make /compare/lease-vs-buy and /tco trip
# these often, which Schemathesis reports as a "schema validation mismatch" warning;
# it does not fail the run.
[checks.positive_data_acceptance]
expected-statuses = ["2XX", 422]

[generation]
max-examples = 500
